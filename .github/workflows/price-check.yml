name: price-check

# GitHub's cron is best effort: a "*/10" schedule can fire late (10-20 minutes
# during peak hours) and is paused after 60 days of repository inactivity.
# Push a commit (or use the "Run workflow" button) to wake it up again.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Never let two runs overlap: both would fetch the same prices and race on the
# same state files. `cancel-in-progress: false` queues the newer run instead.
concurrency:
  group: price-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  price-check:
    name: Scan watchlist and answer commands
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository (with state)
        uses: actions/checkout@v4
        with:
          # The state files are committed back at the end of the run.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the bot
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run the bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_DISCOUNT_PCT: ${{ vars.MIN_DISCOUNT_PCT || secrets.MIN_DISCOUNT_PCT || '20' }}
          COOLDOWN_HOURS: ${{ vars.COOLDOWN_HOURS || '12' }}
          LOG_LEVEL: INFO
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets are required."
            exit 1
          fi
          python -m mont_indirim_bot.main --mode both

      - name: Commit the updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain data/)" ]; then
            echo "No state change, nothing to commit."
            exit 0
          fi

          git add data/
          # [skip ci] keeps this push from re-triggering workflows (GITHUB_TOKEN
          # pushes do not trigger them anyway, but the marker makes it explicit).
          git commit -m "chore(state): update price state [skip ci]"

          # Retry the push in case the branch moved while we were scraping.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing on origin/${GITHUB_REF_NAME}."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "::error::Could not push the updated state."
          exit 1
